<!DOCTYPE html>
<!-- ВАЖНО: для сайта нужен результат `npm run build` (папка dist/), не этот файл с /src/main.tsx -->
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Учитель & Нейросети — платформа и практика внедрения AI в работу педагога."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,400&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Учитель & Нейросети — AI для педагогов</title>
    <script>
      /* При base: './' бандл грузится относительно URL страницы — нужен завершающий / у «папки» GitHub Pages. */
      (function () {
        var path = location.pathname;
        if (path === "/" || path.endsWith("/")) return;
        var last = path.split("/").pop() || "";
        if (last.indexOf(".") !== -1) return;
        location.replace(path + "/" + location.search + location.hash);
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
