<!DOCTYPE html>
<!-- ВАЖНО: для сайта нужен результат `npm run build` (папка dist/), не этот файл с /src/main.tsx -->
<html lang="ru" class="dark">
  <head>
    <script>
      (function () {
        var loc = window.location;
        var path = loc.pathname;

        try {
          var t = localStorage.getItem("uchitel-theme");
          document.documentElement.classList.remove("dark", "light");
          document.documentElement.classList.add(t === "light" ? "light" : "dark");
        } catch (e) {}

        /* GitHub Pages: без завершающего / относительные ./assets/ часто уезжают в корень хоста — скрипт 404, белый экран. */
        if (path !== "/" && path !== "" && !path.endsWith("/")) {
          var last = path.split("/").pop() || "";
          if (last.indexOf(".") === -1) {
            loc.replace(path + "/" + loc.search + loc.hash);
            return;
          }
        }

        /* Явный <base>: бандл из ./assets/ резолвится от каталога Pages (напр. /repo/). */
        var segments = path.split("/").filter(Boolean);
        if (
          segments.length &&
          segments[segments.length - 1].indexOf(".") !== -1
        ) {
          segments.pop();
        }
        var basePath =
          segments.length === 0 ? "/" : "/" + segments.join("/") + "/";
        var baseEl = document.createElement("base");
        baseEl.href = basePath;
        document.head.insertBefore(baseEl, document.head.firstChild);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Учитель и нейросети — методическая поддержка педагога при внедрении инструментов на базе искусственного интеллекта."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,400&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Учитель и нейросети — методические материалы и практика</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
